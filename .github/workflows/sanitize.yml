name: Sanitizers

on: [push, pull_request]

jobs:
  linux-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build with ASan
        run: |
          cmake -B build-asan -S . \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -O1 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build-asan

      - name: Create test data
        run: |
          mkdir -p build-asan/bin
          echo "10 20 30" > build-asan/bin/data.txt
          echo "5 15 25" >> build-asan/bin/data.txt

      - name: Run with ASan
        run: |
          cd build-asan/bin
          ./parent data.txt ./child

      - name: Build for Valgrind
        run: |
          cmake -B build-valgrind -S . -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-valgrind
          mkdir -p build-valgrind/bin
          echo "10 20 30" > build-valgrind/bin/data.txt
          echo "5 15 25" >> build-valgrind/bin/data.txt

      - name: Run with Valgrind
        run: |
          cd build-valgrind/bin
          valgrind --leak-check=full --error-exitcode=1 ./parent data.txt ./child

  windows-sanitizers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Build with ASan (MSVC)
        shell: pwsh
        run: |
          cmake -B build-asan -S . `
            -DCMAKE_C_FLAGS="/fsanitize=address /Zi /Od /MD" `
            -DCMAKE_EXE_LINKER_FLAGS="/fsanitize=address"
          # Собираем, но без флага --config Release, чтобы файлы легли прямо в bin, как на Linux
          cmake --build build-asan

      - name: Copy ASan DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dll) { 
              New-Item -ItemType Directory -Force -Path build-asan/bin
              Copy-Item $dll.FullName build-asan/bin/ 
          }

      - name: Create test data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-asan/bin
          "10 20 30" | Out-File -FilePath build-asan/bin/data.txt -Encoding utf8NoBOM
          "5 15 25" | Out-File -FilePath build-asan/bin/data.txt -Append -Encoding utf8NoBOM

      - name: Run with ASan (Verbose)
        shell: pwsh
        env:
          ASAN_OPTIONS: verbosity=1:detect_leaks=1
        run: |
          $binDir = Resolve-Path "build-asan/bin"
          
          $env:PATH = "$binDir;" + $env:PATH
          
          cd build-asan/bin
          
          $parentPath = (Resolve-Path "parent.exe").Path
          $childPath = (Resolve-Path "child.exe").Path
          
          & $parentPath data.txt $childPath
