name: Sanitizers

on: [push, pull_request]

jobs:
  linux-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build with ASan
        run: |
          cmake -B build-asan -S . \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -O1 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build-asan

      - name: Create test data
        run: |
          mkdir -p build-asan/bin
          echo "10 20 30" > build-asan/bin/data.txt
          echo "5 15 25" >> build-asan/bin/data.txt

      - name: Run with ASan
        run: |
          cd build-asan/bin
          ./parent data.txt ./child

      - name: Build for Valgrind
        run: |
          cmake -B build-valgrind -S . -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-valgrind
          mkdir -p build-valgrind/bin
          echo "10 20 30" > build-valgrind/bin/data.txt
          echo "5 15 25" >> build-valgrind/bin/data.txt

      - name: Run with Valgrind
        run: |
          cd build-valgrind/bin
          valgrind --leak-check=full --error-exitcode=1 ./parent data.txt ./child

  windows-sanitizers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install Dr. Memory
        shell: pwsh
        run: |
          # Устанавливаем Dr. Memory через встроенный менеджер пакетов choco
          choco install drmemory.portable -y

      - name: Build in Debug
        shell: pwsh
        run: |
          # Для корректного отчета об утечках (со строками кода) собираем в Debug
          cmake -B build-debug -S .
          cmake --build build-debug --config Debug

      - name: Create test data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-debug/bin/Debug
          "10 20 30" | Out-File -FilePath build-debug/bin/Debug/data.txt -Encoding utf8NoBOM
          "5 15 25" | Out-File -FilePath build-debug/bin/Debug/data.txt -Append -Encoding utf8NoBOM

      - name: Run with Dr. Memory
        shell: pwsh
        run: |
          
          $binDir = (Get-Item "build-debug/bin/Debug").FullName
          $env:PATH = "$binDir;" + $env:PATH
          
          cd build-debug/bin/Debug

          drmemory.exe -batch -follow_children -exit_code_if_errors 1 -- .\parent.exe data.txt child.exe
